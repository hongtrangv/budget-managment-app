
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch</title>
    <link rel="stylesheet" href="/static/css/calendar.css">
</head>
<body>
    <div class="page-container">
        <div class="calendar-container">
            <div class="calendar-header">
                <div class="month-navigation">
                    <button id="prev-month-btn">&lt;</button>
                    <button id="today-btn">Hôm nay</button>
                    <button id="next-month-btn">&gt;</button>
                </div>
                <h2 id="current-month-year">Tháng 5, 2024</h2>
            </div>
            <div class="calendar-body">
                <div class="day-names">
                    <span>Th 2</span>
                    <span>Th 3</span>
                    <span>Th 4</span>
                    <span>Th 5</span>
                    <span>Th 6</span>
                    <span>Th 7</span>
                    <span>CN</span>
                </div>
                <div class="days-grid" id="calendar-days">
                    <!-- Calendar days will be generated by JavaScript -->
                </div>
            </div>           
        </div>

        <!-- Task List Section -->
        <div class="task-container">
            <div class="task-header">
                <h2>Công việc cho <span id="selected-date-display">...</span></h2>
                <button id="add-task-btn">Thêm công việc</button>
            </div>
            <ul id="task-list"></ul>
        </div>
    </div>

    <!-- Task Add/Edit Modal -->
    <div id="task-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 overflow-y-auto h-full w-full items-center justify-center z-50" style="display:none;">
        <div class="relative top-1/4 mx-auto p-6 border w-11/12 md:w-2/3 lg:w-1/2 shadow-2xl rounded-lg bg-white dark:bg-gray-800">
            <form id="task-form">
                <h3 id="task-modal-title" class="text-xl leading-6 font-bold text-gray-900 dark:text-white mb-6">Tạo Công việc mới</h3>
                <!-- Hidden fields for storing task ID (when editing) and the target date -->
                <input type="hidden" id="task-id" name="taskId">
                <input type="hidden" id="task-date" name="date">

                <div class="space-y-4">
                    <div>
                        <label for="task-description" class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Mô tả công việc</label>
                        <textarea id="task-description" name="description" required class="input-field w-full" rows="3" placeholder="Nội dung công việc..."></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="task-assignee-select" class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Giao cho (Assignee)</label>
                            <select id="task-assignee-select" name="assignee" required class="modern-select input-field w-full">
                                <option value="" disabled selected>Đang tải danh sách...</option>
                            </select>
                        </div>
                        <div>
                            <label for="task-due-date" class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Thời hạn (Due Date)</label>
                            <input type="date" id="task-due-date" name="dueDate" required class="input-field w-full">
                        </div>
                    </div>
                </div>
                <div class="flex justify-end space-x-3 mt-8">
                    <button type="button" id="cancel-task-btn" class="btn btn-secondary">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu Công việc</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/calendar.js"></script>
</body>
</html>
