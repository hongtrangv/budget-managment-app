<div class="p-6 bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Quản lý giá</h1>
            <p class="text-gray-600">Khai báo sản phẩm, nhập giá và theo dõi lịch sử thay đổi</p>
        </div>

        <!-- Tab Navigation -->
        <div class="border-b border-gray-200 mb-6">
            <nav class="-mb-px flex space-x-8">
                <button id="tab-products" class="tab-button active py-2 px-1 border-b-2 border-blue-500 font-medium text-sm text-blue-600">
                    Khai báo sản phẩm
                </button>
                <button id="tab-add" class="tab-button py-2 px-1 border-b-2 border-transparent font-medium text-sm text-gray-500 hover:text-gray-700 hover:border-gray-300">
                    Nhập giá
                </button>
                <button id="tab-manage" class="tab-button py-2 px-1 border-b-2 border-transparent font-medium text-sm text-gray-500 hover:text-gray-700 hover:border-gray-300">
                    Quản lý giá
                </button>
            </nav>
        </div>

        <!-- ===================== TAB: KHAI BÁO SẢN PHẨM ===================== -->
        <div id="content-products" class="tab-content">
            <div class="bg-white shadow rounded-lg p-6 mb-4">
                <h2 class="text-lg font-medium text-gray-900 mb-4">Thêm sản phẩm mới</h2>
                <form id="product-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label for="product-name-declare" class="block text-sm font-medium text-gray-700 mb-1">
                                Tên sản phẩm <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="product-name-declare" name="name" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="Nhập tên sản phẩm">
                        </div>
                        <div>
                            <label for="product-unit" class="block text-sm font-medium text-gray-700 mb-1">Đơn vị tính</label>
                            <input type="text" id="product-unit" name="unit"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="VD: kg, lít, cái...">
                        </div>
                        <div>
                            <label for="product-description" class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
                            <input type="text" id="product-description" name="description"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="Mô tả ngắn (tùy chọn)">
                        </div>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" id="reset-product-form" class="btn btn-secondary btn-refresh">Làm mới</button>
                        <button type="submit" class="btn btn-primary btn-save">Thêm sản phẩm</button>
                    </div>
                </form>
            </div>

            <!-- Danh sách sản phẩm -->
            <div class="bg-white shadow rounded-lg">
                <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                    <h3 class="text-base font-medium text-gray-900">Danh sách sản phẩm</h3>
                    <button id="refresh-products" class="btn btn-secondary btn-refresh">Tải lại</button>
                </div>
                <div id="products-table-container" class="overflow-x-auto">
                    <!-- Injected by JS -->
                </div>
                <div id="products-pagination" class="px-6 py-4 border-t border-gray-200 flex justify-between items-center hidden">
                    <div class="text-sm text-gray-700">
                        Hiển thị <span id="prod-showing-from" class="font-medium">1</span>–<span id="prod-showing-to" class="font-medium">10</span> / <span id="prod-total" class="font-medium">0</span>
                    </div>
                    <div class="flex space-x-2">
                        <button id="prod-prev-page" disabled class="px-3 py-2 border border-gray-300 rounded-md text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">Trước</button>
                        <span id="prod-page-info" class="px-3 py-2 text-gray-700">Trang 1</span>
                        <button id="prod-next-page" disabled class="px-3 py-2 border border-gray-300 rounded-md text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">Sau</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===================== TAB: NHẬP GIÁ ===================== -->
        <div id="content-add" class="tab-content hidden">
            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="text-lg font-medium text-gray-900 mb-4">Nhập giá sản phẩm</h2>
                <form id="price-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="price-product-select" class="block text-sm font-medium text-gray-700 mb-1">
                                Sản phẩm <span class="text-red-500">*</span>
                            </label>
                            <select id="price-product-select" name="product_name" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">-- Chọn sản phẩm --</option>
                            </select>
                        </div>
                        <div>
                            <label for="price" class="block text-sm font-medium text-gray-700 mb-1">
                                Giá (VND) <span class="text-red-500">*</span>
                            </label>
                            <input type="number" id="price" name="price" required min="0" step="1000"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="Nhập giá">
                        </div>
                        <div>
                            <label for="effective-date" class="block text-sm font-medium text-gray-700 mb-1">
                                Ngày áp dụng <span class="text-red-500">*</span>
                            </label>
                            <input type="date" id="effective-date" name="effective_date" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label for="supplier" class="block text-sm font-medium text-gray-700 mb-1">
                                Nhà cung cấp <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="supplier" name="supplier" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="Nhập tên nhà cung cấp">
                        </div>
                    </div>
                    <div>
                        <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
                        <textarea id="notes" name="notes" rows="2"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                  placeholder="Ghi chú (tùy chọn)"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" id="reset-form" class="btn btn-secondary btn-refresh">Làm mới</button>
                        <button type="submit" class="btn btn-primary btn-save">Lưu giá</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ===================== TAB: QUẢN LÝ GIÁ ===================== -->
        <div id="content-manage" class="tab-content hidden">
            <div class="bg-white shadow rounded-lg">
                <!-- Bộ lọc -->
                <div class="p-6 border-b border-gray-200">
                    <h2 class="text-lg font-medium text-gray-900 mb-4">Tìm kiếm</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label for="search-products" class="block text-sm font-medium text-gray-700 mb-1">Sản phẩm</label>
                            <select id="search-products" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Tất cả sản phẩm</option>
                            </select>
                        </div>
                        <div>
                            <label for="search-supplier" class="block text-sm font-medium text-gray-700 mb-1">Nhà cung cấp</label>
                            <select id="search-supplier" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Tất cả nhà cung cấp</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button id="search-prices" class="btn btn-primary btn-search w-full">Tìm kiếm</button>
                        </div>
                    </div>
                </div>

                <!-- Bảng giá mới nhất -->
                <div id="prices-table-container" class="overflow-x-auto">
                    <!-- Injected by JS -->
                </div>

                <!-- Pagination -->
                <div id="pagination" class="px-6 py-4 border-t border-gray-200 flex justify-between items-center hidden">
                    <div class="text-sm text-gray-700">
                        Hiển thị <span id="showing-from" class="font-medium">1</span>–<span id="showing-to" class="font-medium">10</span> / <span id="total-results" class="font-medium">0</span>
                    </div>
                    <div class="flex space-x-2">
                        <button id="prev-page" disabled class="px-3 py-2 border border-gray-300 rounded-md text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">Trước</button>
                        <span id="current-page-info" class="px-3 py-2 text-gray-700">Trang 1</span>
                        <button id="next-page" disabled class="px-3 py-2 border border-gray-300 rounded-md text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">Sau</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Chỉnh sửa sản phẩm -->
<div id="edit-product-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-1/2 lg:w-1/3 shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-medium text-gray-900">Chỉnh sửa sản phẩm</h3>
            <button id="close-edit-product-modal" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <form id="edit-product-form" class="space-y-4">
            <input type="hidden" id="edit-product-id">
            <div>
                <label for="edit-product-name" class="block text-sm font-medium text-gray-700 mb-1">Tên sản phẩm <span class="text-red-500">*</span></label>
                <input type="text" id="edit-product-name" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="edit-product-unit" class="block text-sm font-medium text-gray-700 mb-1">Đơn vị tính</label>
                <input type="text" id="edit-product-unit" name="unit" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="edit-product-description" class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
                <input type="text" id="edit-product-description" name="description" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" id="cancel-edit-product" class="btn btn-secondary">Hủy</button>
                <button type="submit" class="btn btn-primary btn-save">Cập nhật</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Chỉnh sửa giá -->
<div id="edit-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-2/3 lg:w-1/2 shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-medium text-gray-900">Chỉnh sửa thông tin giá</h3>
            <button id="close-edit-modal" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <form id="edit-price-form" class="space-y-4">
            <input type="hidden" id="edit-price-id">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="edit-product-name" class="block text-sm font-medium text-gray-700 mb-1">Tên sản phẩm <span class="text-red-500">*</span></label>
                    <input type="text" id="edit-product-name" name="product_name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="edit-price" class="block text-sm font-medium text-gray-700 mb-1">Giá (VND) <span class="text-red-500">*</span></label>
                    <input type="number" id="edit-price" name="price" required min="0" step="1000" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="edit-effective-date" class="block text-sm font-medium text-gray-700 mb-1">Ngày áp dụng <span class="text-red-500">*</span></label>
                    <input type="date" id="edit-effective-date" name="effective_date" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="edit-supplier" class="block text-sm font-medium text-gray-700 mb-1">Nhà cung cấp <span class="text-red-500">*</span></label>
                    <input type="text" id="edit-supplier" name="supplier" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div>
                <label for="edit-notes" class="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
                <textarea id="edit-notes" name="notes" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" id="cancel-edit" class="btn btn-secondary">Hủy</button>
                <button type="submit" class="btn btn-primary btn-save">Cập nhật</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Lịch sử giá -->
<div id="history-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-10 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-2/3 shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h3 class="text-lg font-medium text-gray-900">Lịch sử thay đổi giá</h3>
                <p id="history-product-name" class="text-sm text-gray-500 mt-1"></p>
            </div>
            <button id="close-history-modal" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="history-table-container" class="overflow-x-auto max-h-96">
            <!-- Injected by JS -->
        </div>
    </div>
</div>
