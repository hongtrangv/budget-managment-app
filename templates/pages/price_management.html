<div class="p-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Quản lý giá</h1>
        <p class="text-gray-600">Quản lý thông tin giá sản phẩm và nhà cung cấp</p>
    </div>

    <!-- Tab Navigation -->
    <div class="border-b border-gray-200 mb-6">
        <nav class="-mb-px flex space-x-8">
            <button id="tab-add" class="tab-button active py-2 px-1 border-b-2 border-blue-500 font-medium text-sm text-blue-600">
                Thêm giá mới
            </button>
            <button id="tab-manage" class="tab-button py-2 px-1 border-b-2 border-transparent font-medium text-sm text-gray-500 hover:text-gray-700 hover:border-gray-300">
                Quản lý giá
            </button>
        </nav>
    </div>

    <!-- Tab Content -->
    <div id="content-add" class="tab-content">
        <div class="bg-white shadow rounded-lg p-6">
            <h2 class="text-lg font-medium text-gray-900 mb-4">Thêm thông tin giá mới</h2>
            
            <form id="price-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Tên sản phẩm -->
                    <div>
                        <label for="product-name" class="block text-sm font-medium text-gray-700 mb-1">
                            Tên sản phẩm <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="product-name" name="product_name" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Nhập tên sản phẩm">
                    </div>

                    <!-- Giá -->
                    <div>
                        <label for="price" class="block text-sm font-medium text-gray-700 mb-1">
                            Giá (VND) <span class="text-red-500">*</span>
                        </label>
                        <input type="number" id="price" name="price" required min="0" step="1000"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Nhập giá">
                    </div>

                    <!-- Ngày áp dụng -->
                    <div>
                        <label for="effective-date" class="block text-sm font-medium text-gray-700 mb-1">
                            Ngày áp dụng <span class="text-red-500">*</span>
                        </label>
                        <input type="date" id="effective-date" name="effective_date" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <!-- Nhà cung cấp -->
                    <div>
                        <label for="supplier" class="block text-sm font-medium text-gray-700 mb-1">
                            Nhà cung cấp <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="supplier" name="supplier" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Nhập tên nhà cung cấp">
                    </div>
                </div>

                <!-- Ghi chú -->
                <div>
                    <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">
                        Ghi chú
                    </label>
                    <textarea id="notes" name="notes" rows="3"
                              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="Nhập ghi chú (tùy chọn)"></textarea>
                </div>

                <!-- Buttons -->
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" id="reset-form" 
                            class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        Làm mới
                    </button>
                    <button type="submit" 
                            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        Thêm giá
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="content-manage" class="tab-content hidden">
        <div class="bg-white shadow rounded-lg">
            <!-- Search and Filter -->
            <div class="p-6 border-b border-gray-200">
                <h2 class="text-lg font-medium text-gray-900 mb-4">Tìm kiếm và lọc</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- Tìm kiếm sản phẩm -->
                    <div>
                        <label for="search-product" class="block text-sm font-medium text-gray-700 mb-1">
                            Tên sản phẩm
                        </label>
                        <input type="text" id="search-product" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Tìm kiếm sản phẩm">
                    </div>

                    <!-- Tìm kiếm nhà cung cấp -->
                    <div>
                        <label for="search-supplier" class="block text-sm font-medium text-gray-700 mb-1">
                            Nhà cung cấp
                        </label>
                        <input type="text" id="search-supplier" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Tìm kiếm nhà cung cấp">
                    </div>

                    <!-- Giá từ -->
                    <div>
                        <label for="min-price" class="block text-sm font-medium text-gray-700 mb-1">
                            Giá từ (VND)
                        </label>
                        <input type="number" id="min-price" min="0" step="1000"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Giá tối thiểu">
                    </div>

                    <!-- Giá đến -->
                    <div>
                        <label for="max-price" class="block text-sm font-medium text-gray-700 mb-1">
                            Giá đến (VND)
                        </label>
                        <input type="number" id="max-price" min="0" step="1000"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Giá tối đa">
                    </div>
                </div>

                <!-- Search buttons -->
                <div class="flex justify-end space-x-3 mt-4">
                    <button id="clear-search" 
                            class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        Xóa bộ lọc
                    </button>
                    <button id="search-prices" 
                            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        Tìm kiếm
                    </button>
                </div>
            </div>

            <!-- Results Table -->
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-medium text-gray-900">Danh sách giá</h3>
                    <div id="results-count" class="text-sm text-gray-500"></div>
                </div>

                <!-- Loading -->
                <div id="loading" class="text-center py-8 hidden">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                    <p class="mt-2 text-gray-600">Đang tải...</p>
                </div>

                <!-- Table -->
                <div id="prices-table-container" class="overflow-x-auto">
                    <table id="prices-table" class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Sản phẩm
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Giá
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Ngày áp dụng
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Nhà cung cấp
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Ghi chú
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Thao tác
                                </th>
                            </tr>
                        </thead>
                        <tbody id="prices-tbody" class="bg-white divide-y divide-gray-200">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>

                <!-- No results -->
                <div id="no-results" class="text-center py-8 hidden">
                    <p class="text-gray-500">Không tìm thấy kết quả nào</p>
                </div>

                <!-- Pagination -->
                <div id="pagination" class="flex justify-between items-center mt-6 hidden">
                    <div class="text-sm text-gray-700">
                        Hiển thị <span id="showing-from">1</span> đến <span id="showing-to">20</span> của <span id="total-results">0</span> kết quả
                    </div>
                    <div class="flex space-x-2">
                        <button id="prev-page" disabled
                                class="px-3 py-2 border border-gray-300 rounded-md text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                            Trước
                        </button>
                        <span id="current-page-info" class="px-3 py-2 text-gray-700">Trang 1</span>
                        <button id="next-page" disabled
                                class="px-3 py-2 border border-gray-300 rounded-md text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                            Sau
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-2/3 lg:w-1/2 shadow-lg rounded-md bg-white">
        <div class="mt-3">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-medium text-gray-900">Chỉnh sửa thông tin giá</h3>
                <button id="close-edit-modal" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form id="edit-price-form" class="space-y-4">
                <input type="hidden" id="edit-price-id">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="edit-product-name" class="block text-sm font-medium text-gray-700 mb-1">
                            Tên sản phẩm <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="edit-product-name" name="product_name" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label for="edit-price" class="block text-sm font-medium text-gray-700 mb-1">
                            Giá (VND) <span class="text-red-500">*</span>
                        </label>
                        <input type="number" id="edit-price" name="price" required min="0" step="1000"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label for="edit-effective-date" class="block text-sm font-medium text-gray-700 mb-1">
                            Ngày áp dụng <span class="text-red-500">*</span>
                        </label>
                        <input type="date" id="edit-effective-date" name="effective_date" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label for="edit-supplier" class="block text-sm font-medium text-gray-700 mb-1">
                            Nhà cung cấp <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="edit-supplier" name="supplier" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label for="edit-notes" class="block text-sm font-medium text-gray-700 mb-1">
                        Ghi chú
                    </label>
                    <textarea id="edit-notes" name="notes" rows="3"
                              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" id="cancel-edit" 
                            class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        Hủy
                    </button>
                    <button type="submit" 
                            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        Cập nhật
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
