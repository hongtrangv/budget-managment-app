<!-- templates/pages/price_management.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Giá</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .tab.active {
            border-bottom: 2px solid #4F46E5; /* indigo-600 */
            font-weight: 600;
            color: #1F2937; /* gray-800 */
        }
    </style>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">Quản lý Giá</h1>

        <!-- Tab Menu -->
        <div class="border-b border-gray-200">
            <nav class="flex space-x-4" aria-label="Tabs">
                <button id="tab-entry" class="tab active py-4 px-2 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
                    Nhập liệu giá
                </button>
                <button id="tab-manage" class="tab py-4 px-2 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
                    Quản lý và Truy vấn
                </button>
            </nav>
        </div>

        <!-- Tab Content -->
        <div class="mt-6">
            <!-- Data Entry Tab Content -->
            <div id="content-entry" class="tab-content active">
                <h2 class="text-xl font-semibold mb-4">Nhập liệu giá sản phẩm</h2>
                <form>
                    <div class="mb-4">
                        <label for="product-name" class="block text-sm font-medium text-gray-700">Tên sản phẩm</label>
                        <input type="text" id="product-name" name="product-name" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                    <div class="mb-4">
                        <label for="product-price" class="block text-sm font-medium text-gray-700">Giá</label>
                        <input type="number" id="product-price" name="product-price" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                    <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Lưu
                    </button>
                </form>
            </div>

            <!-- Management & Querying Tab Content -->
            <div id="content-manage" class="tab-content">
                <h2 class="text-xl font-semibold mb-4">Quản lý và Truy vấn giá</h2>
                <div class="mt-4">
                    <input type="text" placeholder="Tìm kiếm sản phẩm..." class="w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="mt-4 flex flex-col">
                    <div class="-my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
                        <div class="py-2 align-middle inline-block min-w-full sm:px-6 lg:px-8">
                            <div class="shadow overflow-hidden border-b border-gray-200 sm:rounded-lg">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tên sản phẩm</th>
                                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Giá</th>
                                            <th scope="col" class="relative px-6 py-3">
                                                <span class="sr-only">Hành động</span>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200">
                                        <!-- Sample Row 1 -->
                                        <tr>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Sản phẩm A</td>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">1,200,000 VND</td>
                                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-4">
                                                <a href="#" class="text-indigo-600 hover:text-indigo-900">Sửa</a>
                                                <a href="#" class="text-red-600 hover:text-red-900 delete-btn">Xóa</a>
                                            </td>
                                        </tr>
                                        <!-- Sample Row 2 -->
                                        <tr>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Sản phẩm B</td>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">350,000 VND</td>
                                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-4">
                                                <a href="#" class="text-indigo-600 hover:text-indigo-900">Sửa</a>
                                                <a href="#" class="text-red-600 hover:text-red-900 delete-btn">Xóa</a>
                                            </td>
                                        </tr>
                                        <!-- Sample Row 3 -->
                                        <tr>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Sản phẩm C</td>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">5,500,000 VND</td>
                                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-4">
                                                <a href="#" class="text-indigo-600 hover:text-indigo-900">Sửa</a>
                                                <a href="#" class="text-red-600 hover:text-red-900 delete-btn">Xóa</a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/price_management.js') }}"></script>
</body>
</html>
