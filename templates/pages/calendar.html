<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch</title>
    <!-- Liên kết đến file CSS gốc của bạn -->
    <link rel="stylesheet" href="/static/css/calendar.css">
</head>
<body>
    <!-- Sử dụng page-container như cũ -->
    <div class="page-container">

        <!-- BỐ CỤC HAI CỘT MỚI -->
        <div class="two-column-layout">

            <!-- CỘT BÊN TRÁI -->
            <div class="left-column">
                <!-- Lịch (sử dụng class gốc) -->
                <div class="calendar-container">
                    <div class="calendar-header">
                        <div class="month-navigation">
                            <button id="prev-month-btn">&lt;</button>
                            <button id="today-btn">Hôm nay</button>
                            <button id="next-month-btn">&gt;</button>
                        </div>
                        <h2 id="current-month-year"></h2>
                    </div>
                    <div class="calendar-body">
                        <div class="day-names">
                            <span>Th 2</span><span>Th 3</span><span>Th 4</span><span>Th 5</span><span>Th 6</span><span>Th 7</span><span>CN</span>
                        </div>
                        <div class="days-grid" id="calendar-days"></div>
                    </div>           
                </div>

                <!-- Công việc trong ngày (sử dụng class gốc) -->
                <div class="task-container">
                    <div class="task-header">
                        <h2>Công việc cho <span id="selected-date-display">...</span></h2>
                        <button id="add-task-btn">Thêm công việc</button>
                    </div>
                    <ul id="task-list"></ul>
                </div>
            </div>

            <!-- CỘT BÊN PHẢI -->
            <div class="right-column">
                <!-- Công việc do tôi tạo (sử dụng class gốc) -->
                <div class="task-container-by-me">
                     <div class="task-header">
                        <h2>Công việc do tôi tạo</h2>
                    </div>
                    <ul id="task-list-by-me"></ul>
                </div>
            </div>

        </div>
    </div>

    <!-- MODAL THÊM/SỬA CÔNG VIỆC (Giữ nguyên, không thay đổi) -->
    <div id="task-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <form id="task-form">
                <h2 id="task-modal-title">Tạo Công việc mới</h2>
                <input type="hidden" id="task-id" name="taskId">
                <input type="hidden" id="task-date" name="date">

                <div class="form-group">
                    <label for="task-description">Mô tả công việc</label>
                    <textarea id="task-description" name="description" required rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="task-assignee-select">Giao cho (Assignee)</label>
                    <select id="task-assignee-select" name="assignee" required>
                        <option value="" disabled selected>Đang tải danh sách...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="task-due-date">Thời hạn (Due Date)</label>
                    <input type="date" id="task-due-date" name="dueDate" required>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancel-task-btn">Hủy</button>
                    <button type="submit">Lưu Công việc</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/calendar.js"></script>
</body>
</html>
