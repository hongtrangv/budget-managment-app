<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Kéo và Thả</title>
    <link rel="stylesheet" href="/static/css/dnd_list.css">
</head>
<body>

    <div class="container">
        <h1>Sắp xếp danh sách công việc</h1>
        <p>Kéo và thả để thay đổi thứ tự ưu tiên.</p>

        <!-- Danh sách có thể sắp xếp -->
        <ul id="sortable-list">
            <!-- 
              - Mỗi mục <li> giờ có một thuộc tính `data-name`.
              - Thuộc tính này sẽ lưu tên gốc của mục.
              - JavaScript sẽ đọc thuộc tính này để cập nhật lại giao diện.
            -->
            <li class="list-item" data-name="Thiết kế giao diện người dùng"></li>
            <li class="list-item" data-name="Xây dựng API cho tính năng mới"></li>
            <li class="list-item" data-name="Viết tài liệu hướng dẫn"></li>
            <li class="list-item" data-name="Sửa lỗi hiển thị trên di động"></li>
            <li class="list-item" data-name="Tối ưu hóa truy vấn cơ sở dữ liệu"></li>
            <li class="list-item" data-name="Triển khai lên máy chủ staging"></li>
        </ul>
    </div>

    <!-- Thư viện SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- Script tùy chỉnh -->
    <script src="/static/js/dnd_list.js"></script>

</body>
</html>
