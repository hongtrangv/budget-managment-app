<div class="flex items-center justify-center h-full">
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">
      <h2 class="text-2xl font-bold text-center text-gray-900">Tạo tài khoản mới</h2>

      <div id="form-message"></div>

      <form id="register-form" class="space-y-6" method="POST">
          <div>
              <label for="username" class="text-sm font-medium text-gray-700">Tên đăng nhập</label>
              <input id="username" name="username" type="text" autocomplete="username" required
                     class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500">
          </div>
          
          <div>
              <label for="fullname" class="text-sm font-medium text-gray-700">Tên đầy đủ</label>
              <input id="fullname" name="fullname" type="text" autocomplete="name" required
                     class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500">
          </div>
          <div>
              <label for="password" class="text-sm font-medium text-gray-700">Mật khẩu</label>
              <input id="password" name="password" type="password" autocomplete="new-password" required
                     class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500">
          </div>

          <div>
              <button type="submit" id="register-submit-button"
                      class="w-full flex justify-center items-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50">
                  <span id="register-button-text">Đăng ký</span>
              </button>
          </div>
      </form>

      <div class="text-sm text-center">
          <a href="/login" data-navigo class="font-medium text-green-600 hover:text-green-500">
              Đã có tài khoản? Đăng nhập
          </a>
      </div>
  </div>
</div>
