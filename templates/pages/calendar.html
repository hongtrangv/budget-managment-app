
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch</title>
    <link rel="stylesheet" href="/static/css/calendar.css">
</head>
<body>
    <div class="page-container">
        <div class="calendar-container">
            <div class="calendar-header">
                <div class="month-navigation">
                    <button id="prev-month-btn">&lt;</button>
                    <button id="today-btn">Hôm nay</button>
                    <button id="next-month-btn">&gt;</button>
                </div>
                <h2 id="current-month-year">Tháng 5, 2024</h2>
            </div>
            <div class="calendar-body">
                <div class="day-names">
                    <span>Th 2</span>
                    <span>Th 3</span>
                    <span>Th 4</span>
                    <span>Th 5</span>
                    <span>Th 6</span>
                    <span>Th 7</span>
                    <span>CN</span>
                </div>
                <div class="days-grid" id="calendar-days">
                    <!-- Calendar days will be generated by JavaScript -->
                </div>
            </div>           
        </div>

        <!-- Task List Section -->
        <div class="task-container">
            <div class="task-header">
                <h2>Công việc cho <span id="selected-date-display">...</span></h2>
                <button id="add-task-btn">Thêm công việc</button>
            </div>
            <ul id="task-list"></ul>
        </div>
    </div>

    <!-- Add Task Modal -->
    <div id="task-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Thêm công việc mới</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-description">Mô tả công việc</label>
                    <textarea id="task-description" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="task-assignee">Giao cho</label>
                    <input type="text" id="task-assignee" required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-task-btn">Hủy</button>
                    <button type="submit">Lưu công việc</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/calendar.js"></script>
</body>
</html>
