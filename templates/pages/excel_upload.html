<div class="container mx-auto p-4 md:p-6 lg:p-8">
    <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">Tải lên và Hiển thị Tệp Excel</h1>
        <p class="text-gray-600 dark:text-gray-300 mb-6">Chọn một tệp Excel (.xls, .xlsx) để tải lên. Hệ thống sẽ tự động đọc và hiển thị nội dung của tệp dưới dạng bảng.</p>

        <!-- Form Tải Lên -->
        <form id="excel-upload-form" class="mb-6">
            <div class="flex items-center justify-center w-full">
                <label for="excel-file-input" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:hover:bg-bray-800 dark:bg-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:hover:border-gray-500">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                        </svg>
                        <p class="mb-2 text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold">Nhấp để tải lên</span> hoặc kéo và thả</p>
                        <p id="file-name-display" class="text-xs text-gray-500 dark:text-gray-400">XLS, XLSX</p>
                    </div>
                    <input id="excel-file-input" type="file" class="hidden" accept=".xls,.xlsx" />
                </label>
            </div> 
            <div class="mt-4 flex justify-end">
                <button type="submit" class="w-full md:w-auto flex justify-center py-2 px-6 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    Xử lý Tệp
                </button>
            </div>
        </form>

        <!-- Vùng chứa cho bảng kết quả -->
        <div id="excel-data-container" class="overflow-x-auto">
            <!-- Bảng dữ liệu sẽ được chèn vào đây bởi JavaScript -->
        </div>
    </div>
</div>
