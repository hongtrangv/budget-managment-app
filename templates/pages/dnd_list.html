      <!DOCTYPE html>
      <html lang="vi">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Danh sách Kéo và Thả</title>
          <link rel="stylesheet" href="/static/css/dnd_list.css">
      </head>
      <body>
     
          <div class="container">
              <h1>Sắp xếp danh sách công việc</h1>

                   - JavaScript sẽ đọc thuộc tính này để cập nhật lại giao diện.
                 -->

                 <li class="list-item" data-name="Sửa lỗi hiển thị trên di động">Sửa lỗi hiển thị trên di động</li>
