<div class="flex items-center justify-center h-full">
  <!-- Nội dung biểu mẫu gốc được bao bọc để căn giữa -->
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">
      <h2 class="text-2xl font-bold text-center text-gray-900">Đăng nhập vào tài khoản của bạn</h2>

      <!-- Vùng chứa để hiển thị các thông báo động từ JavaScript -->
      <div id="form-message"></div>

      <form id="login-form" class="space-y-6" method="POST">
          <div>
              <label for="username" class="text-sm font-medium text-gray-700">Tên đăng nhập</label>
              <input id="username" name="username" type="text" autocomplete="username" required
                     class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500">
          </div>

          <div>
              <label for="password" class="text-sm font-medium text-gray-700">Mật khẩu</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required
                     class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500">
          </div>

          <div class="flex items-center justify-between">
              <div class="flex items-center">
                  <input id="remember-me" name="remember-me" type="checkbox"
                         class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded">
                  <label for="remember-me" class="ml-2 block text-sm text-gray-900">Nhớ mật khẩu</label>
              </div>
          </div>

          <div>
              <button type="submit"
                      class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                  Đăng nhập
              </button>
          </div>
      </form>

      <div class="text-sm text-center">
          <a href="/register" data-navigo class="font-medium text-green-600 hover:text-green-500">
              Chưa có tài khoản? Đăng ký
          </a>
      </div>
  </div>
</div>
